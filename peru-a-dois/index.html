<title>Peru a Dois</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky header with a woven Andean band, card stack in the middle, tab bar fixed at the bottom. */
:root{
  --bg:#F5F3F8; --surface:#FFFFFF; --surface-2:#EEEAF4; --ink:#1D1838; --muted:#686283; --line:#E1DCEA;
  --accent:#C2185B; --accent-ink:#FFFFFF; --accent-soft:#F9DCE8; --maize:#D99410; --lake:#0B8585; --lake-soft:#D5F0EE;
  --good:#1E8A4C; --good-soft:#DDF3E5; --warn:#B86E00; --warn-soft:#FBEBD0; --bad:#BF3A2B; --bad-soft:#F8DEDA;
  --shadow:0 10px 30px rgba(29,24,56,.12);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110E20; --surface:#1B172E; --surface-2:#252040; --ink:#EEEBF7; --muted:#A39CC0; --line:#2F2950;
  --accent:#F0558F; --accent-ink:#1A0712; --accent-soft:#3D1529; --maize:#F2B53A; --lake:#38C6C2; --lake-soft:#103433;
  --good:#4CC97E; --good-soft:#123222; --warn:#F2A93B; --warn-soft:#3A2A10; --bad:#F07565; --bad-soft:#3D1A16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#110E20; --surface:#1B172E; --surface-2:#252040; --ink:#EEEBF7; --muted:#A39CC0; --line:#2F2950;
  --accent:#F0558F; --accent-ink:#1A0712; --accent-soft:#3D1529; --maize:#F2B53A; --lake:#38C6C2; --lake-soft:#103433;
  --good:#4CC97E; --good-soft:#123222; --warn:#F2A93B; --warn-soft:#3A2A10; --bad:#F07565; --bad-soft:#3D1A16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.band{height:8px;background:
  linear-gradient(135deg,var(--accent) 25%,transparent 25%) -6px 0/12px 8px,
  linear-gradient(225deg,var(--accent) 25%,transparent 25%) -6px 0/12px 8px,
  linear-gradient(315deg,var(--maize) 25%,transparent 25%) 0 0/12px 8px,
  linear-gradient(45deg,var(--maize) 25%,var(--lake) 25%) 0 0/12px 8px}
.toprow{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;flex:1;min-width:0}
.brand small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px 5px 5px;font-weight:600;font-size:13px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-display);color:#fff;flex:none}
.dot.p1{background:var(--lake)} .dot.p2{background:var(--accent)}
.progress{display:flex;gap:10px;align-items:center;padding-bottom:10px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px}
.bar i.p1{background:var(--lake);height:3px;top:0} .bar i.p2{background:var(--accent);height:3px;top:3px}
.banner{font-size:12.5px;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);margin-top:10px}

main{padding-block:14px 110px}
.view[hidden]{display:none}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.badge{min-width:16px;height:16px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:16px;padding:0 4px;position:absolute;margin-left:18px;margin-top:-4px}
nav.tabs button{position:relative}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;font-weight:500;margin-left:4px}

/* card stack */
.stack{position:relative;min-height:540px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);touch-action:pan-y;user-select:none;position:relative;z-index:2;will-change:transform}
.card.behind{position:absolute;inset:10px 10px auto;z-index:1;transform:scale(.96) translateY(14px);opacity:.6;pointer-events:none;height:200px}
.card.fly{transition:transform .35s ease,opacity .35s ease}
.cover{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);overflow:hidden}
.cover svg,.cover img{width:100%;height:100%;display:block;object-fit:cover}
.gal{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.cover .shade,.cover .tag,.cover .route,.cover .illo{pointer-events:none}
.galbtn{position:absolute;top:42%;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#1D1838;display:grid;place-items:center;font:700 18px/1 var(--f-body);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.galbtn.prev{left:10px}.galbtn.next{right:10px}
.galbtn:disabled{opacity:0;pointer-events:none}
.galcount{position:absolute;top:44px;right:12px;background:rgba(16,12,36,.72);color:#fff;font:700 11.5px var(--f-body);padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px;pointer-events:none;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:#fff}
.credit{position:absolute;right:10px;bottom:16px;z-index:2;font-size:10.5px;color:rgba(255,255,255,.85);text-decoration:none;background:rgba(16,12,36,.5);padding:2px 7px;border-radius:6px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .shade{position:absolute;inset:auto 0 0;padding:40px 16px 22px;background:linear-gradient(transparent,rgba(10,8,24,.78));color:#fff}
.cover .shade h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.cover .shade .place{font-size:13px;opacity:.9;margin-top:2px}
.cover .tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#1D1838;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.cover .route{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.cover .route span{background:rgba(16,12,36,.72);color:#fff;font:700 11px var(--f-body);padding:4px 7px;border-radius:7px}
.cover .route span.out{background:#BF3A2B}
.cover .illo{position:absolute;top:44px;left:12px;font-size:10.5px;color:rgba(255,255,255,.75)}
.stamp{position:absolute;top:28%;font:800 30px var(--f-display);padding:6px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-12deg);z-index:3;background:rgba(255,255,255,.85)}
.stamp.yes{left:18px;color:#1E8A4C;border-color:#1E8A4C}
.stamp.no{right:18px;color:#BF3A2B;border-color:#BF3A2B;transform:rotate(12deg)}
.body{padding:14px 16px 16px;display:grid;gap:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.fact b{display:block;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.desc{margin:0;color:var(--ink)}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{font-weight:700;cursor:pointer;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
.more h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.more ul{margin:0;padding-left:18px}
.more li{margin:3px 0}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a,.btn-ghost{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--surface)}
.partner{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.partner .pill{font-weight:700;color:var(--ink)}

.rate{display:grid;gap:8px}
.rate-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{aspect-ratio:1;border-radius:10px;border:0;font:700 15px var(--f-display);color:#fff;font-variant-numeric:tabular-nums;padding:0;transition:transform .12s}
.scale button:active{transform:scale(.9)}
.scale button.mine{outline:3px solid var(--ink);outline-offset:2px}
.actions{display:flex;gap:8px;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.empty{text-align:center;padding:40px 16px;display:grid;gap:12px;justify-items:center}
.empty p{color:var(--muted);margin:0;max-width:38ch}

/* overlay toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.matchpop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(17,14,32,.6);padding:24px}
.matchpop div{background:var(--surface);border-radius:22px;padding:26px 22px;text-align:center;max-width:340px;box-shadow:var(--shadow)}
.matchpop h2{font-size:36px;color:var(--accent);font-weight:800}
@media (prefers-reduced-motion:no-preference){.matchpop div{animation:pop .35s ease}@keyframes pop{from{transform:scale(.7);opacity:0}}}

/* sections */
.sec{display:grid;gap:12px;margin-bottom:26px}
.sec>h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec>p.lead{margin:-6px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{font:800 24px var(--f-display);display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.bucket{display:grid;gap:8px}
.bucket h3{font-size:16px;display:flex;align-items:center;gap:8px}
.bucket h3 .count{font:600 12px var(--f-body);color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;text-align:left;width:100%}
.row .th{width:44px;height:44px;border-radius:9px;overflow:hidden}
.row .th svg,.row .th img{width:100%;height:100%;display:block;object-fit:cover}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:14px;line-height:1.25}
.row .nm span{font-size:12px;color:var(--muted)}
.sc{display:flex;gap:4px}
.sc i{font-style:normal;font:700 13px var(--f-display);min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-variant-numeric:tabular-nums}
.sc i.na{background:var(--surface-2);color:var(--muted)}
.pinned{font-size:10.5px;font-weight:700;color:var(--lake);text-transform:uppercase;letter-spacing:.05em}
.cut{font-size:10.5px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.05em}
.summary p{margin:0 0 8px}
.summary p:last-child{margin:0}

/* duels */
.duel{display:grid;gap:12px}
.duel .q{font:700 19px var(--f-display)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.side{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.side .cv{aspect-ratio:1/1;max-width:100%}
.side .cv svg,.side .cv img{width:100%;height:100%;display:block;object-fit:cover}
.side .tx{padding:8px 10px 10px;display:grid;gap:2px}
.side .tx b{font-size:14px;line-height:1.25}
.side .tx span{font-size:12px;color:var(--muted)}
.side.lean{border-color:var(--accent)}
.vsmark{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 13px var(--f-display)}
.slider{display:grid;gap:6px}
.slider input{width:100%;accent-color:var(--accent)}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.slider output{text-align:center;font-weight:700}

/* routes */
.opt{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.opt.best{border:2px solid var(--accent)}
.opt-h{padding:14px 16px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.opt-h .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.opt-h h3{font-size:21px;font-weight:800}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter .bar{height:8px}
.meter .bar i{height:8px;background:var(--accent)}
.meter b{color:var(--ink);font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.opt-b{padding:12px 16px 16px;display:grid;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mini{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.mini b{display:block;font-variant-numeric:tabular-nums}
.mini span{font-size:11.5px;color:var(--muted)}
.days{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.day{padding:0 0 10px 14px;position:relative}
.day::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.day.heavy::before{border-color:var(--bad);background:var(--bad)}
.day.mid::before{border-color:var(--maize)}
.day b{font-size:13px}
.day .sleep{font-size:12px;color:var(--muted)}
.day .chg{display:inline-block;font-size:11px;font-weight:700;color:var(--lake);background:var(--lake-soft);padding:1px 6px;border-radius:6px;margin-left:4px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.list-in,.list-out{margin:0;padding-left:18px;font-size:14px}
.list-out li{color:var(--muted)}
.costs{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.costs td{padding:4px 0;border-bottom:1px dashed var(--line)}
.costs td:last-child{text-align:right;white-space:nowrap}
.costs tr.tot td{font-weight:800;border-bottom:0;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:8px 10px;font-size:13px}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 12px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .by{display:block;font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.claude{align-self:flex-start;background:var(--lake-soft);border-bottom-left-radius:5px;max-width:94%}
.msg .apply{margin-top:8px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px;display:grid;gap:8px}
.composer textarea{width:100%;min-height:52px;max-height:160px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.composer .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:45;background:rgba(17,14,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet-in .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.onb{display:grid;gap:14px}
.onb .pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb .pick button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 10px;display:grid;justify-items:center;gap:8px;font-weight:700}
.onb .pick .dot{width:44px;height:44px;font-size:18px}
.onb input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);width:100%}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clearbox{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.clearbox h3{font-size:16px}
.clearbox .act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.names label{font-size:12px;color:var(--muted);display:grid;gap:4px}
</style>

<header class="top">
  <div class="band" aria-hidden="true"></div>
  <div class="wrap">
    <div class="toprow">
      <div class="brand">Peru a Dois<small>Lima · Cusco · Machu Picchu · set 2027</small></div>
      <button class="who" id="whoBtn" aria-label="Trocar pessoa"><span class="dot p1" id="whoDot">?</span><span id="whoName">Quem é você?</span></button>
    </div>
    <div class="progress" id="progress"></div>
    <div class="banner" id="banner" hidden></div>
  </div>
</header>

function bindGalleries(root){
  root.querySelectorAll("[data-gal]").forEach(g=>{
    const cv=g.parentElement; const n=g.children.length; if(n<2) return;
    const files=JSON.parse(cv.querySelector("[data-credits]").textContent);
    const upd=()=>{ const i=Math.round(g.scrollLeft/g.clientWidth);
      cv.querySelector(".galcount").textContent=`${i+1}/${n}`;
      cv.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
      cv.querySelector(".prev").disabled=i===0; cv.querySelector(".next").disabled=i===n-1;
      const cr=cv.querySelector(".credit"); if(files[i]){ cr.outerHTML=`<a class="credit" href="https://commons.wikimedia.org/wiki/${encodeURIComponent(files[i])}" target="_blank" rel="noopener">Wikimedia Commons ↗</a>`; } else cr.outerHTML=`<span class="credit">foto de vocês</span>`; };
    g.addEventListener("scroll",()=>{ clearTimeout(g._t); g._t=setTimeout(upd,60); },{passive:true});
    cv.querySelectorAll("[data-gp]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); g.scrollBy({left:+b.dataset.gp*g.clientWidth,behavior:"smooth"}); });
  });
}

async function initCaps(){

  const [d,u,s,a] = await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample"),claude.use("assets")]);
  db=d; user=u; sample=s; assets=a;
  if(user){ try{ myUid = await user.id(); }catch{} }
  if(!db){ setBanner("Modo local: os votos ficam só neste aparelho. Entre logado no claude.ai para sincronizar."); loadLocal(); render(); return; }
  db.doc("meta/couple").onSnapshot(snap=>{ META = snap.exists?snap.data():{}; if(META.names) NAMES={...NAMES,...META.names};
    if(!ME && myUid && META.uids){ for(const p of ["p1","p2"]) if(META.uids[p]===myUid){ ME=p; LS.set("me",p); } }
    render(); if(!ME) openOnboarding(); }, e=>console.warn(e));
  for(const p of ["p1","p2"]) db.doc("votes/"+p).onSnapshot(snap=>{
    const d = snap.exists?snap.data():{};
    LOADED[p]=true;
    if(p===ME && snap.metadata.hasPendingWrites) return;
    const ts=d.updatedAt||0; // drop stale deliveries older than what this device already has
    if(ts < LASTSEEN[p] || (p===ME && ts < myLastSave)) return;
    LASTSEEN[p]=ts;
    const prevMine = VOTES[p];
    VOTES[p] = {scores:{...(d.scores||{})}, duels:{...(d.duels||{})}};
    if(p===ME && pendingSave) { VOTES[p] = prevMine; }
    render();
  }, e=>console.warn(e));
  db.doc("meta/adjust").onSnapshot(snap=>{ const d=snap.exists?snap.data():{}; ADJ={pin:d.pin||[],cut:d.cut||[],tier:d.tier||null}; if(ADJ.tier) tier=ADJ.tier; render(); });
  db.doc("meta/photos").onSnapshot(snap=>{ const d=snap.exists?snap.data():{}; PHOTOS={}; for(const [k,v] of Object.entries(d.map||{})) PHOTOS[k]="/_blob/"+v; render(); });
  db.collection("chat").orderBy("ts").limit(300).onSnapshot(snap=>{ CHAT = snap.docs.map(x=>({id:x.id,...x.data()})); if(tab==="chat") renderChat(); updateBadge(); }, e=>console.warn(e));
}

function sc(p,id){ const v=VOTES[p]?.scores?.[id]; return typeof v==="number"?v:null; }
function duelVal(p,id){ const v=VOTES[p]?.duels?.[id]; return typeof v==="number"?v:null; }
function duelAvg(id){ const a=duelVal("p1",id), b=duelVal("p2",id); if(a==null&&b==null) return null; if(a==null) return b; if(b==null) return a; return (a+b)/2; }
function itemBias(id){ let b=0; for(const d of DUELS){ const v=duelAvg(d.id); if(v==null) continue; if(d.a.item===id) b+=-v*0.2; if(d.b.item===id) b+=v*0.2; } return b; }
function combined(id){
  const a=sc("p1",id), b=sc("p2",id);
  let base = a==null&&b==null ? null : a==null ? b : b==null ? a : (a+b)/2;
  const bias=itemBias(id);
  if(base==null) return bias? 5+bias : null;
  return Math.max(0,Math.min(10,base+bias));
}
function bucketOf(id){
  const a=sc("p1",id), b=sc("p2",id); if(a==null||b==null) return null;
  if(a>=8&&b>=8) return "love";
  if(Math.abs(a-b)>=4) return "split";
  if(a<=3&&b<=3) return "cut";
  if(a>=6&&b>=6) return "like";
  return "meh";
}
const BUCKETS = {
  love:{t:"Os dois querem muito",c:"var(--good)",d:"Nota 8+ dos dois. Prioridade máxima."},
  like:{t:"Os dois topam",c:"var(--lake)",d:"Nota 6+ dos dois. Entra se couber."},
  split:{t:"Divergências",c:"var(--warn)",d:"Diferença de 4+ pontos. Conversem sobre estes."},
  meh:{t:"Mornos",c:"var(--muted)",d:"Nem lá nem cá."},
  cut:{t:"Podem deixar de fora",c:"var(--bad)",d:"Nota 3 ou menos dos dois."}
};
function paceThreshold(){ const v=duelAvg("pace"); return v==null?6.5: v<0? 6 : 7.5; }
function suggestedTier(){ const v=duelAvg("budget"); return v==null?null: v<=-2?"econ": v>=2?"conf":"meio"; }
const isPinned=id=>ADJ.pin.includes(id), isCut=id=>ADJ.cut.includes(id);
function c(id){ if(isCut(id)) return -1; if(isPinned(id)) return 11; const v=combined(id); return v==null?5:v; }

function buildOption(key){
  const R = ROUTES[key]; const regions=new Set(R.regions); const incl=new Set(); const adds=[]; const notes=[]; let extra=0;
  const days = R.days.map(d=>({...d, ids:[...d.ids], extras:[]}));
  days.forEach(d=>d.ids.forEach(id=>incl.add(id)));
  // Huaraz day 4 (B)
  const hz = days.find(d=>d.hz);
  if(hz){ const pick = c("pastoruri")>c("churup")?"pastoruri":"churup"; hz.ids=[pick]; hz.t = pick==="churup"?"Laguna Churup (trilha moderada, aclimatação)":"Geleira Pastoruri (caminhada leve a 5.240 m)"; incl.add(pick); }
  // Cusco free-day slot
  const slot = days.find(d=>d.slot);
  if(slot){
    let cands = SLOT_IDS.filter(id=>!isCut(id));
    if(slot.valeOpt) cands = cands.concat(["pisac"]);
    let best = cands.map(id=>[id,c(id)]).sort((a,b)=>b[1]-a[1])[0];
    let pick = best && best[1]>=6 ? best[0] : (key==="C"?"pisac":"cusco-pe");
    if(key==="C" && pick==="pisac"){ slot.t="Vale Sagrado: Pisac e Ollantaytambo"; slot.ids=["pisac","ollantaytambo","feira-pisac"]; slot.r="vale"; }
    else { const it=ITEM[pick]; slot.t = pick==="cusco-pe" ? "Cusco a pé: San Blas, mercados e compras (dia leve)" : it.name; slot.ids = [pick,...slot.ids]; slot.e = it.eff; slot.chg = pick!=="humantay"; slot.r="cusco"; }
    slot.ids.forEach(id=>incl.add(id));
    const base = key==="A"?720:0; const cost = pick==="pisac"?0:ITEM[pick].price; const delta = cost-base;
    if(delta) adds.push([`Dia livre: ${pick==="pisac"?"Vale Sagrado":ITEM[pick].name}`, delta]);
  }
  if(key==="C" && slot && slot.r==="vale") regions.add("vale");
  // Bus vs hotel (B)
  const bus = duelAvg("bus");
  if(key==="B" && bus!=null && bus>=2){ adds.push(["Hotel em Lima no lugar de 1 noite de ônibus",560]); notes.push("Vocês preferem hotel a ônibus noturno: somamos uma noite em Lima na volta de Huaraz."); }
  // Trains
  const trainDay = days.find(d=>d.train);
  if(trainDay){
    const legs = key==="C"?1:2; const baseCost = key==="C"?1070:1765;
    const best = TRAINS.filter(id=>!isCut(id)).map(id=>[id,c(id)]).sort((a,b)=>b[1]-a[1])[0];
    let pick = best && best[1]>=5 ? best[0] : null;
    if(pick){ const cost=ITEM[pick].price*legs; adds.push([`Trem ${ITEM[pick].name} (${legs===2?"ida e volta":"volta"})`, cost-baseCost]); incl.add(pick); trainDay.train=ITEM[pick].name; }
    else trainDay.train = key==="C"?"Vistadome (volta)":"Expedition na ida, Vistadome na volta";
    if(key!=="C" && c("hiram")>=8){ adds.push(["Trem Hiram Bingham na ida (luxo)",3200]); incl.add("hiram"); trainDay.train="Hiram Bingham na ida, "+trainDay.train; }
  }
  // Luxury hotels
  const valeNight = days.find(d=>d.lux==="vale");
  if(valeNight){
    const best = VALE_LUX.filter(id=>c(id)>=7).sort((a,b)=>c(b)-c(a)||ITEM[a].price-ITEM[b].price)[0];
    if(best){ valeNight.s = ITEM[best].name; valeNight.chg=true; adds.push([`Noite no ${ITEM[best].name}`, ITEM[best].price]); incl.add(best); }
  }
  const parNight = days.find(d=>d.lux==="paracas");
  if(parNight && c("paracas-luxo")>=7){ parNight.s="Hotel de luxo em Paracas"; parNight.chg=true; adds.push(["Hotel de luxo em Paracas",1040]); incl.add("paracas-luxo"); }
  // Extras by region
  const thr = paceThreshold();
  const extras = ITEMS.filter(it=>it.routes.includes("x") && it.cat!=="trem" && it.cat!=="hotel" && !incl.has(it.id) && (regions.has(it.region)||it.region==="peru") && (c(it.id)>=thr));
  const extrasByRegion = {};
  for(const it of extras){
    if(it.cat==="prato") { extrasByRegion.peru ||= []; extrasByRegion.peru.push(it); continue; }
    if(it.id==="via-ferrata" && incl.has("skylodge")) continue;
    if(["huayna-picchu","montana-mp"].includes(it.id)){ const alt = it.id==="huayna-picchu"?"montana-mp":"huayna-picchu"; if(extras.some(e=>e.id===alt) && c(alt)>c(it.id)) continue; }
    (extrasByRegion[it.region] ||= []).push(it); incl.add(it.id);
    if(it.price) extra+=it.price;
  }
  for(const it of (extrasByRegion.peru||[])) incl.add(it.id);
  const mpDay = days.find(d=>d.ids.includes("machu-picchu"));
  if(mpDay && extrasByRegion.mp){ mpDay.extras = extrasByRegion.mp; delete extrasByRegion.mp; }
  for(const d of days){ if(d.r!=="peru" && extrasByRegion[d.r]){ d.extras = extrasByRegion[d.r]; delete extrasByRegion[d.r]; } }
  if(extra) adds.push([`Encaixes escolhidos (${extras.filter(i=>i.cat!=="prato").length} itens: restaurantes, passeios, experiências)`, extra]);
  // Coverage
  let want=0, got=0; const missed=[];
  for(const it of ITEMS){ if(it.cat==="prato"||it.cat==="trem") continue; const v=c(it.id); if(v<6) continue; const w=v-5; want+=w; if(incl.has(it.id)) got+=w; else missed.push(it); }
  const lowIn = [...incl].filter(id=>{ const a=sc("p1",id), b=sc("p2",id); return a!=null&&b!=null&&a<=3&&b<=3; }).map(id=>ITEM[id]);
  let pct = want? got/want*100 : 0;
  const rb = routeDuelBonus(key); pct = Math.max(0,Math.min(100,pct + rb*3));
  const base = R.cost[tier];
  const addsTotal = adds.reduce((s,a)=>s+a[1],0)*INFL;
  return {key,R,days,incl,adds,addsTotal,base,total:base+addsTotal,pct,missed:missed.sort((a,b)=>c(b.id)-c(a.id)),lowIn,notes,extrasPeru:extrasByRegion.peru||[]};
}
function routeDuelBonus(k){
  let s=0; const pairs={rAB:["A","B"],rBC:["B","C"],rAC:["A","C"]};
  for(const [id,[a,b]] of Object.entries(pairs)){ const v=duelAvg(id); if(v==null) continue; if(k===a) s+=-v; if(k===b) s+=v; }
  return s/2;
}
function allOptions(){ return ["A","B","C"].map(buildOption).sort((x,y)=>y.pct-x.pct); }

function render(){
  renderHeader();
  for(const t of ["cards","duels","match","routes","chat"]) $("#v-"+t).hidden = t!==tab;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"page":"false"));
  if(tab==="cards") renderCards();
  if(tab==="duels") renderDuels();
  if(tab==="match") renderMatch();
  if(tab==="routes") renderRoutes();
  if(tab==="chat") renderChat();
  updateBadge();
}
function renderHeader(){
  const dot=$("#whoDot"), nm=$("#whoName");
  if(ME){ dot.className="dot "+ME; dot.textContent=(NAMES[ME]||"?")[0].toUpperCase(); nm.textContent=NAMES[ME]; }
  else { dot.className="dot p1"; dot.textContent="?"; nm.textContent="Quem é você?"; }
  const n=ITEMS.length, a=Object.keys(VOTES.p1.scores).length, b=Object.keys(VOTES.p2.scores).length;
  $("#progress").innerHTML = `<span><b style="color:var(--lake)">${esc(NAMES.p1)}</b> ${a}/${n}</span><div class="bar"><i class="p1" style="width:${a/n*100}%"></i><i class="p2" style="width:${b/n*100}%"></i></div><span><b style="color:var(--accent)">${esc(NAMES.p2)}</b> ${b}/${n}</span>`;
}

function queue(){
  const mine = VOTES[ME]?.scores||{};
  return ITEMS.filter(it=>mine[it.id]==null && (catFilter==="all"||it.cat===catFilter))
    .sort((x,y)=>(skipSet.has(x.id)-skipSet.has(y.id)) || prio(x)-prio(y) || (hash(x.id+"o")%997)-(hash(y.id+"o")%997));
}
function prio(it){ return /[ABCs]/.test(it.routes)?0 : it.routes==="f"?2 : 1; }

function renderCards(){
  const v=$("#v-cards");
  if(!ME){ v.innerHTML=`<div class="empty"><h2>Quem está votando?</h2><p>Escolham quem é quem para cada um votar no próprio celular.</p><button class="btn primary" onclick="openOnboarding()">Escolher</button></div>`; return; }
  if(db && !LOADED[ME]){ v.innerHTML=`<div class="empty"><p>Carregando os votos…</p></div>`; return; }
  const counts={all:0}; const mine=VOTES[ME].scores;
  for(const it of ITEMS){ if(mine[it.id]!=null) continue; counts.all++; counts[it.cat]=(counts[it.cat]||0)+1; }
  const chips = [["all","Tudo"],...Object.entries(CATS).map(([k,o])=>[k,o.label])].map(([k,l])=>`<button class="chip" aria-pressed="${catFilter===k}" data-cat="${k}">${l}<span class="n">${counts[k]||0}</span></button>`).join("");
  const q=queue(); const it=q[0], next=q[1];
  let html = `<div class="chips" role="toolbar" aria-label="Filtrar por tipo">${chips}</div>`;
  if(!it){
    html += `<div class="empty"><h2>${catFilter==="all"?"Você avaliou tudo!":"Nada pendente aqui"}</h2><p>${catFilter==="all"?`Agora vá para os Duelos, ou veja o Match com ${esc(NAMES[other(ME)])}.`:"Escolha outra categoria."}</p><div class="actions"><button class="btn" data-go="duels">Ir aos duelos</button><button class="btn primary" data-go="match">Ver o match</button></div></div>`;
    v.innerHTML=html; bindCommon(v); return;
  }
  html += `<div class="stack">${next?`<div class="card behind" aria-hidden="true"><div class="cover">${cover(next)}</div></div>`:""}${cardHTML(it,true)}</div>`;
  html += `<div class="actions" style="margin-top:12px"><button class="btn small" id="undo" ${lastRated.length?"":"disabled"}>Desfazer</button><span class="note" style="align-self:center">Deslize as fotos para o lado. Arraste o card pelo texto: direita = quero (9), esquerda = corta (2)</span><button class="btn small" id="skip">Pular</button></div>`;
  v.innerHTML=html; bindCommon(v);
  const card=$(".card:not(.behind)",v); bindSwipe(card,it);
  $("#skip",v).onclick=()=>{ skipSet.delete(it.id); skipSet.add(it.id); renderCards(); };
  $("#undo",v).onclick=()=>{ const id=lastRated.pop(); if(id){ delete VOTES[ME].scores[id]; saveMine(); renderCards(); renderHeader(); } };
}

        ME&&pv!=null?`<div class="partner"><span class="dot ${other(ME)}" style="width:20px;height:20px;font-size:10px">${esc(NAMES[other(ME)][0])}</span>${esc(NAMES[other(ME)])} já votou. Vote para ver a nota.</div>`:""}

function bindCommon(root){
  bindGalleries(root);
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{catFilter=b.dataset.cat;renderCards()});
  root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  root.querySelectorAll("[data-score]").forEach(b=>b.onclick=e=>{e.stopPropagation(); const card=b.closest(".card"); rate(card.dataset.id,+b.dataset.score,card,0)});
  root.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>{ADJ.pin=[...new Set([...ADJ.pin,b.dataset.pin])];ADJ.cut=ADJ.cut.filter(x=>x!==b.dataset.pin);saveAdj();toast("Fixado no roteiro")});
  root.querySelectorAll("[data-unpin]").forEach(b=>b.onclick=()=>{ADJ.pin=ADJ.pin.filter(x=>x!==b.dataset.unpin);saveAdj()});
  root.querySelectorAll("[data-cutit]").forEach(b=>b.onclick=()=>{ADJ.cut=[...new Set([...ADJ.cut,b.dataset.cutit])];ADJ.pin=ADJ.pin.filter(x=>x!==b.dataset.cutit);saveAdj();toast("Tirado do roteiro")});
  root.querySelectorAll("[data-uncut]").forEach(b=>b.onclick=()=>{ADJ.cut=ADJ.cut.filter(x=>x!==b.dataset.uncut);saveAdj()});
  root.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>pickPhoto(b.dataset.photo));
  root.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openItem(b.dataset.open));
}
function rate(id,score,card,dir){
  if(!ME) return openOnboarding();
  VOTES[ME].scores[id]=score; lastRated.push(id); if(lastRated.length>20) lastRated.shift(); saveMine();
  const pv=sc(other(ME),id);
  const inSheet = card && card.closest(".sheet");
  if(inSheet){ openItem(id); render(); return; }
  if(card){ card.classList.add("fly"); const d=dir||(score>=6?1:score<=4?-1:0); card.style.transform=`translate(${d*130}%, ${d?-10:-120}px) rotate(${d*18}deg)`; card.style.opacity="0"; }
  setTimeout(()=>{ renderCards(); renderHeader(); if(pv!=null&&pv>=8&&score>=8) matchPop(id); },card?260:0);
}
function matchPop(id){
  const d=document.createElement("div"); d.className="matchpop"; d.innerHTML=`<div><h2>Match!</h2><p><b>${esc(ITEM[id].name)}</b><br>vocês dois deram 8 ou mais.</p><button class="btn primary">Continuar</button></div>`;
  d.onclick=()=>d.remove(); document.body.append(d); setTimeout(()=>d.remove(),2600);
}
function bindSwipe(card,it){
  let sx=0,sy=0,dx=0,drag=false,id=null;
  const yes=$(".stamp.yes",card), no=$(".stamp.no",card);
  card.addEventListener("pointerdown",e=>{ if(e.target.closest("button,a,summary,details[open] *,.gal")) return; drag=true; id=e.pointerId; sx=e.clientX; sy=e.clientY; dx=0; card.style.transition="none"; });
  card.addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==id) return; dx=e.clientX-sx; const dy=e.clientY-sy; if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dx)<10) return; if(Math.abs(dx)>8) card.setPointerCapture?.(id);
    card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`; yes.style.opacity=Math.max(0,Math.min(1,dx/100)); no.style.opacity=Math.max(0,Math.min(1,-dx/100)); });
  const end=()=>{ if(!drag) return; drag=false; card.style.transition="";
    if(dx>110) rate(it.id,9,card,1); else if(dx<-110) rate(it.id,2,card,-1); else { card.style.transform=""; yes.style.opacity=0; no.style.opacity=0; } };
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",end);
}

/* ---------- photos (editors only) ---------- */
function pickPhoto(id){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; toast("Enviando foto…");
    try{ const blob = await shrink(f); const res = await assets.upload(blob); const cur=(await db.doc("meta/photos").get()); const map={...(cur.exists?cur.data().map:{})}; map[id]=res.id; await db.doc("meta/photos").set({map}); toast("Foto adicionada"); }
    catch(e){ console.warn(e); toast("Não deu para enviar a foto."); } };
  inp.click();
}
function shrink(file){ return new Promise((res)=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,1200/img.width); const cv=document.createElement("canvas"); cv.width=img.width*s; cv.height=img.height*s; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); cv.toBlob(b=>res(b||file),"image/jpeg",.82); }; img.onerror=()=>res(file); img.src=URL.createObjectURL(file); }); }

function openItem(id){
  closeSheet(); const it=ITEM[id];
  const s=document.createElement("div"); s.className="sheet"; s.innerHTML=`<div class="sheet-in" role="dialog" aria-label="${esc(it.name)}"><div class="grab"></div>${cardHTML(it,true)}<div class="actions" style="margin-top:12px"><span></span><button class="btn" data-close>Fechar</button></div></div>`;
  s.addEventListener("click",e=>{ if(e.target===s||e.target.closest("[data-close]")) closeSheet(); });
  document.body.append(s); bindCommon(s);
}
function closeSheet(){ document.querySelectorAll(".sheet").forEach(x=>x.remove()); }

let duelIdx = null;
function sideInfo(sd){ if(sd.item){ const it=ITEM[sd.item]; return {label:it.name,sub:`${it.price?brl(it.price):"grátis"} · ${EFF[it.eff]}${it.alt?" · "+it.alt:""}`,svg:cover(it),id:it.id}; } return {label:sd.label,sub:sd.sub,svg:scene(sd.scene,sd.label)}; }
function renderDuels(){
  const v=$("#v-duels");
  if(!ME){ v.innerHTML=`<div class="empty"><h2>Quem está votando?</h2><button class="btn primary" onclick="openOnboarding()">Escolher</button></div>`; return; }
  const mine=VOTES[ME].duels; const done=DUELS.filter(d=>mine[d.id]!=null).length;
  const pending = DUELS.findIndex(d=>mine[d.id]==null);
  if(duelIdx==null||duelIdx<0||duelIdx>=DUELS.length) duelIdx = pending<0?0:pending;
  const d=DUELS[duelIdx]; const A=sideInfo(d.a), B=sideInfo(d.b);
  const val = mine[d.id] ?? 0; const pv = duelVal(other(ME),d.id);
  v.innerHTML = `<div class="sec"><h2>Duelos</h2><p class="lead">Um contra o outro: puxe para o lado que você prefere. ${done}/${DUELS.length} respondidos.</p>
    <div class="panel duel">
      <div class="note">${duelIdx+1} de ${DUELS.length}</div>
      <div class="q">${esc(d.q)}</div>
      <div class="vs"><button class="side ${val<0?"lean":""}" data-lean="-4"><div class="cv">${A.svg}</div><div class="tx"><b>${esc(A.label)}</b><span>${esc(A.sub)}</span></div></button>
        <button class="side ${val>0?"lean":""}" data-lean="4"><div class="cv">${B.svg}</div><div class="tx"><b>${esc(B.label)}</b><span>${esc(B.sub)}</span></div></button><div class="vsmark">VS</div></div>
      <div class="slider"><input type="range" min="-5" max="5" step="1" value="${val}" id="duelRange" aria-label="Preferência">
        <div class="ends"><span>muito mais esquerda</span><span>tanto faz</span><span>muito mais direita</span></div>
        <output id="duelOut">${duelText(val,A,B)}</output></div>
      ${pv!=null&&mine[d.id]!=null?`<div class="partner"><span class="dot ${other(ME)}" style="width:20px;height:20px;font-size:10px">${esc(NAMES[other(ME)][0])}</span>${esc(NAMES[other(ME)])}: ${esc(duelText(pv,A,B))}</div>`:pv!=null?`<div class="partner">${esc(NAMES[other(ME)])} já respondeu. Responda para ver.</div>`:""}
      <div class="actions"><button class="btn" id="dPrev" ${duelIdx===0?"disabled":""}>Anterior</button>
        ${A.id||B.id?`<span>${A.id?`<button class="btn small" data-open="${A.id}">Ver A</button>`:""} ${B.id?`<button class="btn small" data-open="${B.id}">Ver B</button>`:""}</span>`:""}
        <button class="btn primary" id="dOk">${mine[d.id]==null?"Confirmar":"Próximo"}</button></div>
    </div></div>
    <div class="sec"><h3>Todos os duelos</h3><div class="rows">${DUELS.map((x,i)=>{const a=duelVal("p1",x.id),b=duelVal("p2",x.id);return `<button class="row" data-di="${i}" style="grid-template-columns:1fr auto"><span class="nm"><b>${esc(x.q)}</b><span>${esc(sideInfo(x.a).label)} × ${esc(sideInfo(x.b).label)}</span></span><span class="sc"><i style="background:${a==null?"":"var(--lake)"}" class="${a==null?"na":""}">${a==null?"–":fmtLean(a)}</i><i style="background:${b==null?"":"var(--accent)"}" class="${b==null?"na":""}">${b==null?"–":fmtLean(b)}</i></span></button>`}).join("")}</div></div>`;
  bindCommon(v);
  const rg=$("#duelRange",v), out=$("#duelOut",v);
  rg.oninput=()=>{ out.textContent=duelText(+rg.value,A,B); v.querySelectorAll(".side").forEach((s,i)=>s.classList.toggle("lean", i===0? +rg.value<0 : +rg.value>0)); };
  v.querySelectorAll("[data-lean]").forEach(b=>b.onclick=()=>{ const cur=+rg.value, dir=+b.dataset.lean>0?1:-1; rg.value = Math.sign(cur)===dir? Math.max(-5,Math.min(5,cur+dir)) : dir*3; rg.oninput(); });
  $("#dOk",v).onclick=()=>{ VOTES[ME].duels[d.id]=+rg.value; saveMine(); const nxt=DUELS.findIndex((x,i)=>i>duelIdx&&VOTES[ME].duels[x.id]==null); duelIdx = nxt>=0?nxt:Math.min(duelIdx+1,DUELS.length-1); renderDuels(); window.scrollTo({top:0,behavior:"smooth"}); };
  $("#dPrev",v).onclick=()=>{ duelIdx=Math.max(0,duelIdx-1); renderDuels(); };
  v.querySelectorAll("[data-di]").forEach(b=>b.onclick=()=>{ duelIdx=+b.dataset.di; renderDuels(); window.scrollTo({top:0,behavior:"smooth"}); });
}
function fmtLean(v){ return v===0?"=":(v<0?"◀"+(-v):v+"▶"); }
function duelText(v,A,B){ if(v===0) return "Tanto faz"; const s=Math.abs(v); const w=s>=5?"Com certeza":s>=3?"Prefiro":"Um pouco mais"; return `${w}: ${v<0?A.label:B.label}`; }

/* ---------- match ---------- */
let matchFilter="all";
function renderMatch(){
  const v=$("#v-match");
  const both = ITEMS.filter(it=>sc("p1",it.id)!=null&&sc("p2",it.id)!=null);
  const groups={love:[],like:[],split:[],meh:[],cut:[]};
  both.forEach(it=>groups[bucketOf(it.id)].push(it));
  for(const k in groups) groups[k].sort((a,b)=>combined(b.id)-combined(a.id));
  const agree = both.length? Math.round(both.filter(it=>Math.abs(sc("p1",it.id)-sc("p2",it.id))<=2).length/both.length*100):0;
  const opts=allOptions(); const best=opts[0];
  let html = `<div class="sec"><h2>Match do casal</h2><p class="lead">${both.length} itens avaliados pelos dois.</p>
    <div class="kpis"><div class="kpi"><b>${groups.love.length}</b><span>os dois amam</span></div><div class="kpi"><b>${groups.split.length}</b><span>divergências</span></div><div class="kpi"><b>${agree}%</b><span>de sintonia</span></div></div>
    <div class="panel summary">${summaryHTML(groups,best)}<div class="actions" style="margin-top:10px"><span></span><button class="btn small primary" id="askSummary">Pedir resumo ao Claude no chat</button></div></div></div>`;
  if(!both.length) html += `<div class="empty"><p>Quando vocês dois avaliarem os mesmos cards, eles aparecem aqui separados em: os dois amam, divergências e podem cortar.</p><button class="btn primary" data-go="cards">Avaliar cards</button></div>`;
  for(const k of ["love","split","like","cut","meh"]){
    const g=groups[k]; if(!g.length) continue; const B=BUCKETS[k];
    html += `<div class="sec bucket"><h3><span class="sw" style="background:${B.c}"></span>${B.t}<span class="count">${g.length}</span></h3><p class="note" style="margin:-8px 0 0">${B.d}</p><div class="rows">${g.slice(0,k==="meh"?8:40).map(rowHTML).join("")}</div></div>`;
  }
  const pend = ITEMS.filter(it=>(sc("p1",it.id)==null)!==(sc("p2",it.id)==null));
  if(pend.length) html += `<div class="sec bucket"><h3><span class="sw" style="background:var(--line)"></span>Só um avaliou<span class="count">${pend.length}</span></h3><div class="rows">${pend.slice(0,30).map(rowHTML).join("")}</div></div>`;
  v.innerHTML=html; bindCommon(v);
  v.querySelectorAll(".row[data-open]").forEach(b=>b.onclick=()=>openItem(b.dataset.open));
  $("#askSummary",v).onclick=()=>{ go("chat"); sendChat("Façam um resumo para nós dois: o que os dois querem muito, onde divergimos, o que aceitamos cortar e qual roteiro vocês recomendam com o orçamento estimado.", true); };
}
function rowHTML(it){
  const a=sc("p1",it.id), b=sc("p2",it.id);
  const flag = isPinned(it.id)?`<span class="pinned">fixado</span>`:isCut(it.id)?`<span class="cut">tirado</span>`:"";
  return `<button class="row" data-open="${it.id}"><span class="th">${cover(it)}</span><span class="nm"><b>${esc(it.name)}</b><span>${CATS[it.cat].label} · ${esc(REGIONS[it.region])} ${flag}</span></span><span class="sc"><i class="${a==null?"na":""}" style="${a==null?"":"background:"+scoreColor(a)}" title="${esc(NAMES.p1)}">${a??"–"}</i><i class="${b==null?"na":""}" style="${b==null?"":"background:"+scoreColor(b)}" title="${esc(NAMES.p2)}">${b??"–"}</i></span></button>`;
}
function summaryHTML(g,best){
  const n1=esc(NAMES.p1), n2=esc(NAMES.p2);
  const top=g.love.slice(0,5).map(i=>esc(i.name)).join(", ");
  const sp=g.split.slice(0,3).map(i=>`${esc(i.name)} (${n1} ${sc("p1",i.id)} × ${n2} ${sc("p2",i.id)})`).join("; ");
  const cut=g.cut.slice(0,5).map(i=>esc(i.name)).join(", ");
  const total=g.love.length+g.like.length+g.split.length+g.meh.length+g.cut.length;
  if(!total) return `<p>O resumo aparece quando os dois tiverem votado em alguns cards. Cada um usa o próprio celular; os votos sincronizam sozinhos.</p>`;
  const dv=duelAvg("dates");
  return `<p><b>Prioridades em comum:</b> ${top||"ainda nenhuma com 8+ dos dois."}</p>
    ${sp?`<p><b>Para conversar:</b> ${sp}.</p>`:""}
    ${cut?`<p><b>Podem cortar sem dó:</b> ${cut}.</p>`:""}
    <p><b>Roteiro com mais match agora:</b> ${best.key} (${esc(best.R.name)}), cobrindo ${Math.round(best.pct)}% do que vocês querem, por ~${brlK(best.total)} na faixa ${TIERS[tier]}.</p>
    ${dv!=null?`<p><b>Datas:</b> ${dv<0?"sáb 4 a seg 13/9":dv>0?"sex 3 a dom 12/9":"tanto faz para vocês"}.</p>`:""}`;
}

/* ---------- routes ---------- */
const TIERS={econ:"econômica",meio:"meio-termo",conf:"confortável"};
let openOpt=null;
function renderRoutes(){
  const v=$("#v-routes"); const opts=allOptions(); const st=suggestedTier();
  if(openOpt==null) openOpt=opts[0].key;
  const cheapest = [...opts].sort((a,b)=>a.total-b.total)[0].key;
  let html=`<div class="sec"><h2>Roteiros sob medida</h2><p class="lead">Os três roteiros do plano, ajustados pelas notas e duelos de vocês. O dia livre, o trem, o hotel especial e os encaixes mudam conforme o que vocês votaram.</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="seg" role="group" aria-label="Faixa de gasto">${Object.entries(TIERS).map(([k,l])=>`<button aria-pressed="${tier===k}" data-tier="${k}">${l[0].toUpperCase()+l.slice(1)}</button>`).join("")}</div>${st&&st!==tier?`<span class="note">Pelos duelos, vocês tendem a ${TIERS[st]}.</span>`:""}</div>
    ${(ADJ.pin.length||ADJ.cut.length)?`<div class="note">Ajustes manuais: ${ADJ.pin.length?`fixados ${ADJ.pin.map(i=>esc(ITEM[i]?.name)).join(", ")}`:""}${ADJ.pin.length&&ADJ.cut.length?" · ":""}${ADJ.cut.length?`tirados ${ADJ.cut.map(i=>esc(ITEM[i]?.name)).join(", ")}`:""} <button class="btn small" id="clearAdj">Limpar</button></div>`:""}
  </div>`;
  opts.forEach((o,i)=>{
    const tags=[i===0?"Melhor match":"", o.key===cheapest?"Mais barato":"", o.key==="C"?"Menos ônibus":"", o.key==="A"?"Único com litoral":"", o.key==="B"?"Único com Laguna 69":""].filter(Boolean).join(" · ");
    const isOpen = openOpt===o.key;
    html+=`<div class="sec"><article class="opt ${i===0?"best":""}">
      <div class="opt-h"><span class="eyebrow">${tags}</span><h3>Roteiro ${o.key}: ${esc(o.R.name)}</h3>
        <div class="meter"><b>${Math.round(o.pct)}%</b><div class="bar"><i style="width:${o.pct}%"></i></div><span>do que vocês querem</span></div>
        <div class="grid4"><div class="mini"><span>Total do casal</span><b>${brlK(o.total)}</b></div><div class="mini"><span>Cidades</span><b>${o.R.cities}</b></div><div class="mini"><span>Deslocamentos</span><b>${esc(o.R.moves)}</b></div><div class="mini"><span>Noites</span><b>${esc(o.R.nights)}</b></div></div>
        <button class="btn small" data-toggle="${o.key}" style="justify-self:start">${isOpen?"Recolher":"Ver dia a dia, custos e o que fica de fora"}</button>
      </div>
      ${isOpen?optBody(o):""}
    </article></div>`;
  });
  html += `<p class="note">Base de custo: totais do plano (voo Brasília–Lima, hospedagem, comida, passeios, trens, voos internos, seguro), já com 6% de inflação e 10% de reserva. Os ajustes também levam inflação e reserva. Os valores são estimativas, não cotações.</p>`;
  v.innerHTML=html; bindCommon(v);
  v.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{ tier=b.dataset.tier; LS.set("tier",tier); ADJ.tier=tier; saveAdj(); });
  v.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{ openOpt = openOpt===b.dataset.toggle?"":b.dataset.toggle; renderRoutes(); });
  const ca=$("#clearAdj",v); if(ca) ca.onclick=()=>{ ADJ.pin=[]; ADJ.cut=[]; saveAdj(); };
}
function optBody(o){
  const loveIn=[...o.incl].filter(id=>bucketOf(id)==="love").map(id=>ITEM[id]);
  const days=o.days.map(d=>{
    const extras = d.extras?.length?`<div class="note">Encaixes: ${d.extras.map(e=>`<button class="linkbtn" data-open="${e.id}">${esc(e.name)}</button>`).join(", ")}</div>`:"";
    return `<div class="day ${d.e===2?"heavy":d.e===1?"mid":""}"><b>${esc(d.d)}</b> · ${esc(d.t)}${d.chg?`<span class="chg">ajustado</span>`:""}${d.train?`<div class="note">Trem: ${esc(d.train)}</div>`:""}<div class="sleep">Dormir: ${esc(d.s)} · ritmo ${EFF[d.e]}</div>${extras}</div>`;
  }).join("");
  const adds=o.adds.map(([l,v])=>`<tr><td>${esc(l)}</td><td>${v>=0?"+":"−"} ${brl(Math.abs(v*INFL))}</td></tr>`).join("");
  return `<div class="opt-b">
    <div><h4 style="margin:0 0 8px">Dia a dia</h4><div class="days">${days}</div></div>
    ${o.extrasPeru.length?`<div class="note">Para provar no caminho: ${o.extrasPeru.map(i=>esc(i.name)).join(", ")}.</div>`:""}
    <div><h4 style="margin:0 0 6px">Custos estimados (casal)</h4><table class="costs"><tr><td>Base do roteiro ${o.key}, faixa ${TIERS[tier]}</td><td>${brl(o.base)}</td></tr>${adds}<tr class="tot"><td>Total</td><td>${brl(o.total)}</td></tr></table></div>
    <div class="grid4"><div class="mini"><span>Tempo em trânsito</span><b>${esc(o.R.ground)}</b></div><div class="mini"><span>Risco</span><b>${esc(o.R.risk)}</b></div></div>
    ${loveIn.length?`<div><h4 style="margin:0 0 4px">Inclui o que os dois amam</h4><ul class="list-in">${loveIn.map(i=>`<li>${esc(i.name)}</li>`).join("")}</ul></div>`:""}
    <div><h4 style="margin:0 0 4px">Fica de fora</h4><p class="note" style="margin:0 0 4px">Pelo plano: ${esc(o.R.outTxt)}.</p>${o.missed.length?`<ul class="list-out">${o.missed.slice(0,12).map(i=>`<li>${esc(i.name)} <span class="note">(nota ${combined(i.id)?.toFixed(1)??"–"}${i.routes==="f"?", não cabe em 10 dias":""})</span></li>`).join("")}</ul>`:`<p class="note">Nada que vocês querem ficou de fora.</p>`}</div>
    ${o.lowIn.length?`<div class="warnbox">Está no roteiro, mas os dois deram nota baixa: ${o.lowIn.map(i=>esc(i.name)).join(", ")}. Dá para trocar por tempo livre.</div>`:""}
    ${o.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}
  </div>`;
}

/* ---------- chat ---------- */
let streaming=null, seenChat=LS.get("seenChat",0);
function renderChat(){
  const v=$("#v-chat");
  const msgs = chatListHTML();
  const list = $("#chatList",v);
  if(list && $("#chatIn",v)){ list.innerHTML = msgs; bindChatList(v); seenChat=CHAT.length; LS.set("seenChat",seenChat); updateBadge(); list.lastElementChild?.scrollIntoView({block:"end"}); return; }
  renderChatShell(v,msgs);
}
function chatListHTML(){
  const msgs = CHAT.map(m=>{
    const cls = m.by==="claude"?"claude": m.by===ME?"me":"them";
    const who = m.by==="claude"?"Claude": NAMES[m.by]||m.by;
    const {text,adj} = splitAdj(m.text||"");
    return `<div class="msg ${cls}"><span class="by">${esc(who)}</span>${esc(text)}${adj?`<div class="apply"><button class="btn small" data-apply="${m.id}">Aplicar ajustes${adj.fixar?.length?" · fixar "+adj.fixar.length:""}${adj.cortar?.length?" · cortar "+adj.cortar.length:""}</button></div>`:""}</div>`;
  }).join("");
  return (msgs||`<div class="empty"><p>Nenhuma mensagem ainda. Experimente: "Queremos ver baleias e a Humantay, cabe?"</p></div>`)+(streaming?`<div class="msg claude"><span class="by">Claude</span><span id="streamTxt">${esc(splitAdj(streaming).text)}</span></div>`:"");
}
function bindChatList(v){ v.querySelectorAll("[data-apply]").forEach(b=>b.onclick=()=>applyAdj(b.dataset.apply)); }
function renderChatShell(v,msgs){
  v.innerHTML = `<div class="sec"><h2>Chat do roteiro</h2><p class="lead">Conversem entre vocês e peçam ajustes ao Claude, que vê as notas, os duelos e os roteiros calculados.</p></div>
    <div class="chat" id="chatList">${msgs}</div>
    <div class="composer">
      <div class="quick">${["Qual roteiro faz mais sentido para nós?","Dá para economizar uns R$ 3 mil?","Como resolver nossas divergências?","Monte um dia perfeito em Cusco","O que reservar primeiro?"].map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <textarea id="chatIn" placeholder="${ME?`Escreva como ${esc(NAMES[ME])}…`:"Escolha quem é você primeiro"}"></textarea>
      <div class="act"><button class="btn" id="sendPlain">Enviar</button><button class="btn primary" id="sendAsk" ${sample?"":"disabled title='Claude indisponível nesta visualização'"}>Enviar e perguntar ao Claude</button></div>
      ${sample?"":`<p class="note" style="margin:0">O Claude só responde quando a página é aberta no claude.ai. As mensagens entre vocês funcionam igual.</p>`}
    </div>`;
  const inp=$("#chatIn",v); inp.value = LS.get("draft","");
  inp.oninput=()=>LS.set("draft",inp.value);
  $("#sendPlain",v).onclick=()=>{ sendChat(inp.value,false); };
  $("#sendAsk",v).onclick=()=>{ sendChat(inp.value,true); };
  v.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>sendChat(b.dataset.q,true));
  bindChatList(v);
  seenChat = CHAT.length; LS.set("seenChat",seenChat); updateBadge();
  const last=v.querySelector("#chatList").lastElementChild; last?.scrollIntoView({block:"end"});
}
function updateBadge(){ const b=document.querySelector('[data-tab="chat"]'); let bd=b.querySelector(".badge"); const n=Math.max(0,CHAT.length-seenChat); if(tab==="chat"||!n){ bd?.remove(); return;} if(!bd){bd=document.createElement("span");bd.className="badge";b.append(bd)} bd.textContent=n; }
function splitAdj(t){ const m=t.match(/AJUSTES:\s*(\{[\s\S]*\})\s*$/); if(!m) return {text:t,adj:null}; try{ const j=JSON.parse(m[1]); return {text:t.slice(0,m.index).trim(), adj:j}; }catch{ return {text:t,adj:null}; } }
function applyAdj(mid){
  const m=CHAT.find(x=>x.id===mid); if(!m) return; const {adj}=splitAdj(m.text); if(!adj) return;
  const ok=id=>!!ITEM[id];
  for(const id of (adj.fixar||[]).filter(ok)){ if(!ADJ.pin.includes(id)) ADJ.pin.push(id); ADJ.cut=ADJ.cut.filter(x=>x!==id); }
  for(const id of (adj.cortar||[]).filter(ok)){ if(!ADJ.cut.includes(id)) ADJ.cut.push(id); ADJ.pin=ADJ.pin.filter(x=>x!==id); }
  if(["econ","meio","conf"].includes(adj.orcamento)){ tier=adj.orcamento; ADJ.tier=tier; }
  saveAdj(); toast("Ajustes aplicados. Veja em Roteiros.");
}
async function addMsg(m){
  if(!db){ m.id="l"+Date.now(); CHAT.push(m); LS.set("chat",CHAT.slice(-200)); renderChat(); return; }
  try{ await db.collection("chat").add(m); }catch(e){ handleWriteErr(e); }
}
async function sendChat(text,ask){
  text=(text||"").trim(); if(!ME) return openOnboarding(); if(!text) return;
  LS.set("draft",""); const inp=$("#chatIn"); if(inp) inp.value="";
  await addMsg({by:ME,text,ts:Date.now()});
  if(ask && sample) askClaude();
}
function contextForClaude(){
  const lines=[];
  for(const it of ITEMS){ const a=sc("p1",it.id), b=sc("p2",it.id); if(a==null&&b==null) continue; lines.push(`${it.id} | ${it.name} | ${REGIONS[it.region]} | R$${it.price} | ${NAMES.p1}:${a??"-"} ${NAMES.p2}:${b??"-"}${isPinned(it.id)?" | FIXADO":""}${isCut(it.id)?" | TIRADO":""}`); }
  const du=DUELS.map(d=>{const a=duelVal("p1",d.id),b=duelVal("p2",d.id); if(a==null&&b==null) return null; return `${d.q} [${sideInfo(d.a).label} × ${sideInfo(d.b).label}] ${NAMES.p1}:${a??"-"} ${NAMES.p2}:${b??"-"} (−5 = esquerda, +5 = direita)`}).filter(Boolean);
  const opts=allOptions().map(o=>`Roteiro ${o.key} (${o.R.name}): match ${Math.round(o.pct)}%, total ~${brl(o.total)} na faixa ${TIERS[tier]}. Dias: ${o.days.map(d=>`${d.d}: ${d.t} (dorme ${d.s})${d.extras?.length?" + "+d.extras.map(e=>e.name).join(", "):""}`).join(" / ")}. Ajustes de custo: ${o.adds.map(a=>a[0]+" "+brl(a[1]*INFL)).join("; ")||"nenhum"}. Fica de fora com nota alta: ${o.missed.slice(0,8).map(i=>i.name).join(", ")||"nada"}.`);
  return `${DOC_DIGEST}\n\nCASAL: ${NAMES.p1} e ${NAMES.p2}.\n\nNOTAS (0 a 10) — id | nome | região | preço casal | notas:\n${lines.join("\n")||"(ninguém votou ainda)"}\n\nDUELOS:\n${du.join("\n")||"(nenhum)"}\n\nROTEIROS CALCULADOS PELO APP:\n${opts.join("\n")}\n\nIDs válidos para ajustes: ${ITEMS.map(i=>i.id).join(", ")}`;
}
async function askClaude(){
  const RULES = `Você é o assistente de viagem de um casal brasileiro planejando 10 dias no Peru em setembro de 2027. Responda em português do Brasil, de forma calorosa, direta e curta (até ~180 palavras, listas curtas quando ajudar). Use as notas e duelos dos dois para justificar. Respeite as regras do plano (aclimatação, não empilhar deslocamentos). Valores são estimativas.
Se a sua resposta sugerir mudanças concretas no roteiro, termine com UMA última linha exatamente neste formato, usando só IDs válidos:
AJUSTES: {"fixar":["id"],"cortar":["id"],"orcamento":"econ|meio|conf"}
(omita chaves que não mudam; não escreva a linha se não houver mudança).

CONTEXTO:
${contextForClaude()}`;
  const turns=[{role:"user",content:RULES},{role:"assistant",content:"Entendido. Estou com as notas e roteiros de vocês."}];
  for(const m of CHAT.slice(-24)){ const role=m.by==="claude"?"assistant":"user"; const content=m.by==="claude"?m.text:`${NAMES[m.by]||m.by}: ${m.text}`; const last=turns[turns.length-1]; if(last.role===role) last.content+="\n"+content; else turns.push({role,content}); }
  if(turns[turns.length-1].role!=="user") return;
  streaming="Pensando…"; if(tab==="chat") renderChat();
  try{
    const res = await sample(turns,{cache:false,onText:({text})=>{ streaming=text; const el=document.getElementById("streamTxt"); if(el) el.textContent=splitAdj(text).text; }});
    streaming=null; await addMsg({by:"claude",text:res.text,ts:Date.now(),askedBy:ME});
  }catch(e){
    streaming=null; if(tab==="chat") renderChat();
    const msg={not_granted:"Sem permissão para chamar o Claude aqui.",rate_limited:"Muitas perguntas seguidas. Esperem um minuto.",refused:"O Claude não respondeu a esta pergunta."}[e?.code]||"O Claude não respondeu agora. Tentem de novo.";
    if(e?.code!=="cancelled") toast(msg);
  }
}

/* ---------- onboarding ---------- */
function openOnboarding(){
  if(document.querySelector(".sheet")) return;
  const s=document.createElement("div"); s.className="sheet";
  s.innerHTML=`<div class="sheet-in onb"><div class="grab"></div><h2>Quem é você neste celular?</h2>
    <p class="note" style="margin:0">Cada um vota no próprio celular. O app junta as respostas dos dois e monta os roteiros.</p>
    <div class="names"><label>Pessoa 1<input id="n1" value="${esc(NAMES.p1)}" maxlength="20"></label><label>Pessoa 2<input id="n2" value="${esc(NAMES.p2)}" maxlength="20"></label></div>
    <div class="pick"><button data-me="p1"><span class="dot p1">${esc(NAMES.p1[0])}</span>Sou ${esc(NAMES.p1)}</button><button data-me="p2"><span class="dot p2">${esc(NAMES.p2[0])}</span>Sou ${esc(NAMES.p2)}</button></div>
    ${ME?`<div class="clearbox"><h3>Minhas respostas (${esc(NAMES[ME])})</h3>
      <p class="note" style="margin:0">Apaga só as suas respostas. As de ${esc(NAMES[other(ME)])} continuam como estão.</p>
      <div class="act" data-clear-step><button class="btn small" data-clear="scores">Limpar minhas notas (${Object.keys(VOTES[ME].scores).length})</button><button class="btn small" data-clear="duels">Limpar meus duelos (${Object.keys(VOTES[ME].duels).length})</button><button class="btn small" data-clear="all">Limpar tudo</button></div></div>
      <button class="btn" data-x>Fechar</button>`:""}</div>`;
  document.body.append(s);
  const LBL={scores:"todas as suas notas",duels:"todos os seus duelos",all:"todas as suas notas e duelos"};
  s.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.clear, box=s.querySelector("[data-clear-step]");
    box.innerHTML=`<span class="warnbox">Apagar ${LBL[k]}? Não dá para desfazer.</span><button class="btn small" data-cancel>Cancelar</button><button class="btn small danger" data-confirm>Apagar</button>`;
    box.querySelector("[data-cancel]").onclick=()=>{ s.remove(); openOnboarding(); };
    box.querySelector("[data-confirm]").onclick=()=>{ clearMine(k); s.remove(); };
  });
  s.querySelectorAll("[data-me]").forEach(b=>b.onclick=async()=>{
    const n1=$("#n1",s).value.trim()||"Dudu", n2=$("#n2",s).value.trim()||"Cami"; NAMES={p1:n1,p2:n2};
    ME=b.dataset.me; LS.set("me",ME); s.remove(); $("#v-chat").innerHTML="";
    const uids={...(META.uids||{})}; if(myUid) uids[ME]=myUid;
    await saveMeta({names:NAMES,uids}); render();
  });
  s.querySelector("[data-x]")?.addEventListener("click",()=>s.remove());
}

function clearMine(kind){
  if(!ME) return;
  if(db && !LOADED[ME]){ toast("Espere os votos carregarem e tente de novo."); return; }
  if(kind!=="duels"){ VOTES[ME].scores={}; lastRated=[]; skipSet.clear(); }
  if(kind!=="scores"){ VOTES[ME].duels={}; duelIdx=null; }
  saveMine(); render(); toast("Suas respostas foram apagadas.");
}

/* ---------- nav ---------- */
const TABS=["cards","duels","match","routes","chat"];
function go(t){ tab=t; if(location.hash!=="#"+t) history.replaceState(null,"","#"+t); closeSheet(); render(); window.scrollTo(0,0); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#whoBtn").onclick=openOnboarding;
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(TABS.includes(h)&&h!==tab) go(h); });
{ const h=location.hash.slice(1); if(TABS.includes(h)) tab=h; }
render();
initCaps();
</script>
